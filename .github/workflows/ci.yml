name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and test
      working-directory: main/backend
      # verify 生命周期已包含 compile + test + integration-test，无需单独跑 test
      run: mvn clean verify -q

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: main/backend/target/surefire-reports/

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven  # 补充缓存，避免每次重新下载依赖

    - name: Check code formatting
      working-directory: main/backend
      # 去掉 || echo，格式不合规时 CI 必须失败
      run: mvn spotless:check

  docker:
    runs-on: ubuntu-latest
    needs: [ build, lint ]  # lint 不通过则跳过 Docker 构建

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker compose build  # Compose V2（ubuntu-latest 预装）

    - name: Test Docker startup
      run: |
        docker compose up -d
        # 轮询等待（最多 150 秒），避免 sleep 固定等待导致偶发失败
        for i in $(seq 1 30); do
          curl -sf http://localhost:8080/actuator/health && break
          echo "Waiting for backend... attempt $i/30"
          sleep 5
        done
        curl -sf http://localhost:8080/actuator/health || { docker compose logs; exit 1; }
        docker compose down -v
