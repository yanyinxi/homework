spring:
  application:
    name: asset-service

  datasource:
    url: jdbc:postgresql://localhost:5432/asset_db
    username: asset
    password: asset123
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AssetHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      # 每次取连接时验证有效性
      connection-test-query: SELECT 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启 SQL 日志（开发调试）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 关闭 MyBatis-Plus 自动填充（字段由 DDL 默认值管理）
      insert-strategy: not_null
      update-strategy: not_null

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.homework.asset: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173

---
# Docker 环境配置覆盖
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/asset_db

logging:
  level:
    com.homework.asset: INFO

app:
  cors:
    allowed-origins: http://localhost,http://127.0.0.1
